services:
  mint-redis:
    image: redis:8.0
    container_name: mint-redis
    ports:
      - 6379:6379
    volumes:
      - mint-data:/data
    restart: unless-stopped

  mint-api:
    image: ghcr.io/mrc-ide/mint-api:${API_REF:-main}
    pull_policy: always
    container_name: mint-api
    restart: unless-stopped
    ports:
      - 8000:8000

  mint-frontend:
    image: ghcr.io/mrc-ide/mint-frontend:${FRONTEND_REF:-main}
    container_name: mint-frontend
    pull_policy: always
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://mint-redis:6379
      - PUBLIC_API_URL=http://mint-api:8000
      - ORIGIN=https://${DOMAIN}
      - IPINFO_TOKEN=${IPINFO_TOKEN}
      - ADDRESS_HEADER=X-Forwarded-For
    depends_on:
      - mint-redis
      - mint-api

  acme-buddy:
    image: ghcr.io/reside-ic/acme-buddy:main
    container_name: acme-buddy
    ports:
      - 2112:2112
    restart: unless-stopped
    volumes:
      - mint-tls:/tls
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ACME_BUDDY_STAGING
    env_file:
      - hdb-credentials
    command: >
      --domain ${DOMAIN}
      --email reside@imperial.ac.uk
      --dns-provider hdb
      --certificate-path /tls/certificate.pem
      --key-path /tls/key.pem
      --account-path /tls/account.json
      --reload-container proxy

  proxy:
    image: nginx:1.29
    container_name: proxy
    restart: always
    ports:
      - 80:80
      - 443:443
    environment:
      - DOMAIN
    volumes:
      - ./templates:/etc/nginx/templates
      - mint-tls:/tls
    depends_on:
      - acme-buddy
      - mint-frontend

volumes:
  mint-data:
  mint-tls:

